[project]
name = "x2-ps5-teleop"
version = "0.1.0"
description = "可在本地测试的 AgiBot X2 PS5 遥操作核心"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x2_ps5_teleop", "demo"]

[project.scripts]
x2-teleop-sim = "x2_ps5_teleop.sim:main"
x2-teleop-ros = "x2_ps5_teleop.ros_node:main"
x2-ps5-input-test = "x2_ps5_teleop.dualsense_test:main"
x2-teleop-demo = "demo.teleop_demo:main"
