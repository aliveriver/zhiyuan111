# 标准 DualSense 映射中观测到的 SDL 编号。
# 配对新手柄后，请使用 `uv run x2-ps5-input-test` 进行确认。
controller:
  name_hint: dualsense
  deadzone: 0.08
  trigger_threshold: 0.75
  timeout_seconds: 0.5
  axes:
    left_x: 0
    left_y: 1
    right_x: 2
    right_y: 3
    left_trigger: 4
    right_trigger: 5
  buttons:
    cross: 0
    circle: 1
    square: 2
    triangle: 3
    l1: 4
    r1: 5
    options_toggle: 9
    ps_estop: 12

robot:
  source: ps5_demo
  max_forward_mps: 0.12
  max_lateral_mps: 0.08
  max_yaw_rps: 0.15
  # These are the currently verified upper-body test motions. They are not
  # dexterous-hand finger presets; replace them only after HandCommandArray
  # joint order, units, and limits are confirmed on the target firmware.
  presets:
    rt: {name: right_wave, motion: 1002, area: 2}
    lt: {name: left_wave, motion: 1002, area: 1}
    r1: {name: right_raise, motion: 1001, area: 2}
    l1: {name: left_raise, motion: 1001, area: 1}
